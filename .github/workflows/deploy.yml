name: RAGY-System-Deploy
on: [push]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify deliverables are present
        run: |
          test -f README.md
          test -f mcp_stdio_server.py
          test -f replica.html
          echo "Deployment artifacts verified (publishing handled by gh-pages / wrangler workflows)."
